<!DOCTYPE html>
<html lang="sq" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyr në bibliotekë</title>
    <link rel="stylesheet" th:href="@{/css/katalogu.css}">
</head>
<body>

    <header>
        <h1>Biblioteka digjitale</h1>
        <p>Hyr në llogarinë tënde.</p>
    </header>

    <main>
        <h2>Hyrja në sistem</h2>

        <p th:if="${param.error}" role="alert">
            Emaili ose fjalëkalimi është i pasaktë,
            ose llogaria nuk është aktive.
        </p>

        <p th:if="${param.logout}" role="status">
            Dolët nga llogaria me sukses.
        </p>

        <form th:action="@{/login}" method="post">
            <div>
                <label for="email">Emaili</label>
                <input
                    type="email"
                    id="email"
                    name="username"
                    autocomplete="username"
                    required>
            </div>

            <div>
                <label for="fjalekalimi">Fjalëkalimi</label>
                <input
                    type="password"
                    id="fjalekalimi"
                    name="password"
                    autocomplete="current-password"
                    required>
            </div>

            <button type="submit">Hyr</button>
        </form>

        <p>
            <a th:href="@{/katalogu}">Kthehu te katalogu</a>
        </p>
    </main>

</body>
</html>
