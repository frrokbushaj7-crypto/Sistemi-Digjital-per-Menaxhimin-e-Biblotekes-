<!DOCTYPE html>
<html lang="sq" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>Katalogu i bibliotekës</title><script th:src="@{/js/rezervimet.js}" defer></script>
    <link rel="stylesheet" th:href="@{/css/katalogu.css}">
</head>
<body>

    <header>
        <h1>Biblioteka digjitale</h1>
        <p>Shfleto librat e bibliotekës.</p>
        <div th:if="${email != null}">
        <p>
            I kyçur si:
            <strong th:text="${email}"></strong>
        </p>

        <form th:action="@{/logout}" method="post">
            <button type="submit">Dil</button>
        </form>
    </div>

    <p th:if="${email == null}">
        <a th:href="@{/hyrja}">Hyr në llogari</a>
    </p>
    </header>

    <main>
        <h2>Katalogu i librave</h2>

        <p th:if="${bibliotekar}">
            <a th:href="@{/librat/shto}">Shto libër</a>
        </p>

        <p th:if="${bibliotekar}">
            <a th:href="@{/bibliotekari/rezervimet}">
                Kërkesat për rezervim
            </a>
        </p>

        <p th:if="${lexues}">
            <a th:href="@{/lexuesi/rezervimet}">
                Rezervimet e mia
            </a>
        </p>

        <p th:if="${#lists.isEmpty(librat)}">
            Aktualisht nuk ka libra në katalog.
        </p>

        <table th:unless="${#lists.isEmpty(librat)}">
            <thead>
                <tr>
                    <th>Titulli</th>
                    <th>Përmbledhja</th>
                    <th>Gjuha</th>
                    <th th:if="${lexues}">Rezervimi</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="libri : ${librat}">
                    <td th:text="${libri.titulli()}"></td>
                    <td th:text="${libri.permbledhja()}"></td>
                    <td th:text="${libri.gjuha()}"></td>

                    <td th:if="${lexues}">
                        <button
                            type="button"
                            class="kerko-rezervim"
                            th:attr="data-libri-id=${libri.libriId()}"
                            disabled>
                            Kërko rezervim
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
        <p
            id="mesazhi-rezervimit"
            th:if="${lexues}"
            role="status"
            aria-live="polite">
        </p>
    </main>

</body>
</html>
